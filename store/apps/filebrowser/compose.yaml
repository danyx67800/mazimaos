services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    restart: unless-stopped
    command: ["-c", "/config/filebrowser.db", "-r", "/srv", "-b", "/apps/filebrowser/"]
    ports:
      - "127.0.0.1:${MAZIMA_APP_PORT}:80"
    volumes:
      - ${MAZIMA_DATA_DIR}:/srv
      - ${MAZIMA_DATA_DIR}/config:/config
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
